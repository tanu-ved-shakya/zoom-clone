services:
  - type: web
    name: zoom-clone-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SQLITE_DB_PATH
        value: /var/data/zoom_clone.db
    disk:
      name: zoom-clone-sqlite
      mountPath: /var/data
      sizeGB: 1
